<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Multiple JSON-LD</title>
    <script type="application/ld+json">
      { "@context": "https://schema.org", "@type": "Organization", "name": "Fixture Inc." }
    </script>
    <script type="application/ld+json">
      { "@context": "https://schema.org", "@type": "WebSite", "name": "Fixture Site", "url": "https://example.com" }
    </script>
  </head>
  <body><main><h1>Multiple schema fixture</h1></main></body>
</html>
