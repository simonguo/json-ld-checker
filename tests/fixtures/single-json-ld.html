<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Single JSON-LD</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Article",
        "headline": "A complete fixture article",
        "author": { "@type": "Person", "name": "Ada" },
        "datePublished": "2026-01-01",
        "publisher": {
          "@type": "Organization",
          "name": "Fixture Press",
          "logo": { "@type": "ImageObject", "url": "https://example.com/logo.png", "width": 1200, "height": 600 }
        }
      }
    </script>
  </head>
  <body><main><h1>Single schema fixture</h1></main></body>
</html>
